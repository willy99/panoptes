# The whole system for `docker compose up` and `make up`.
services:
  nats:
    image: nats:2.12-alpine
    # -js turns on JetStream, -sd is where it stores streams, -m serves the monitoring endpoint used by the health check.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: panoptes
      POSTGRES_DB: panoptes
      # Local development only: trust authentication needs no password, so none is kept in the repository.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      # TCP on purpose: during first-time initialisation Postgres answers only on its socket,
      # so a socket check would report ready before the database exists.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "panoptes", "-d", "panoptes"]
      interval: 2s
      timeout: 2s
      retries: 30

  panoptes: &panoptes
    build: .
    image: panoptes:local
    environment:
      DATABASE_URL: postgres://panoptes@postgres:5432/panoptes?sslmode=disable
      # NATS_URL, HTTP_ADDR and the EPISODE_* durations keep their defaults; set them here to change them.
    ports:
      - "8080:8080"
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
    # SIGTERM first, SIGKILL only after 30s: the service's own shutdown deadline is 20s.
    stop_grace_period: 30s

  # A second, identical instance for the multi-instance demo:
  # `docker compose --profile multi up`. It shares the consumer and the
  # database with the first and needs no other configuration.
  panoptes-2:
    <<: *panoptes
    ports:
      - "8081:8080"
    profiles: [multi]
